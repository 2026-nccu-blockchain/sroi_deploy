services:
  db-tunnel:
    image: cloudflare/cloudflared:latest
    command:
      - access
      - tcp
      - --hostname
      - ${DB_TUNNEL_HOSTNAME}
      - --url
      - 0.0.0.0:15432
    restart: unless-stopped

  backend:
    build: ./sroi_backend
    environment:
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db-tunnel:15432/${DB_NAME}
      MAX_REQUESTS: ${MAX_REQUESTS}
      WINDOW_SECONDS: ${WINDOW_SECONDS}
      SROI_DEBUG: ${SROI_DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    volumes:
      - uploads:/app/app/uploads
    depends_on:
      - db-tunnel
    restart: on-failure

  frontend:
    build: ./sroi_frontend
    environment:
      SERVER_URL: ${SERVER_URL:-_}
      # 只替換列出的變數，避免動到 $host、$remote_addr 這些 nginx 變數
      # 多個變數時寫成 "^(SERVER_URL|OTHER_VAR)$"
      NGINX_ENVSUBST_FILTER: "^(SERVER_URL)$"
    volumes:
      # 啟動時 envsubst 產生 /etc/nginx/conf.d/default.conf，同時蓋掉預設的設定
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads: