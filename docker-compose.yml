services:
  nginx:
    image: nginx:stable
    ports:
     - "8080:80"
    environment:
      SERVER_URL: ${SERVER_URL:-_}
      # 只替換列出的變數，避免動到 $host、$remote_addr 這些 nginx 變數
      # 多個變數時寫成 "^(SERVER_URL|OTHER_VAR)$"
      NGINX_ENVSUBST_FILTER: "^(SERVER_URL)$"
    volumes:
      # 啟動時 envsubst 產生 /etc/nginx/conf.d/default.conf，同時蓋掉預設的設定
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend
      - frontend
    # 只有 nginx 對外，所以要同時接 public（發布 port）和 internal（轉發給內部服務）
    networks:
      - public
      - internal
    restart: unless-stopped

  backend:
    build: ./sroi_backend
    environment:
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      MAX_REQUESTS: ${MAX_REQUESTS}
      WINDOW_SECONDS: ${WINDOW_SECONDS}
      SROI_DEBUG: ${SROI_DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      BREVO_WELCOME_TEMPLATE_ID: ${BREVO_WELCOME_TEMPLATE_ID}
    volumes:
      - uploads:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # 要呼叫 Brevo API 寄信，需要 public 才能連外（沒有 ports，所以外面還是連不進來）
    networks:
      - internal
      - public
    restart: unless-stopped

  frontend:
    build: ./sroi_frontend
    depends_on:
      - backend
    networks:
      - internal
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      # 只綁本機，需要時用 SSH tunnel 連：ssh -L 5050:127.0.0.1:5050 <server>
      - "127.0.0.1:5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    # internal 網路無法發布 port，所以也要接 public
    networks:
      - internal
      - public
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

networks:
  # 一般 bridge，可以連外、可以發布 port
  public:
    driver: bridge
  # 內部網路，不能連外，也無法從外部連進來
  internal:
    driver: bridge
    internal: true

volumes:
  uploads:
  pgadmin_data:
  db_data: